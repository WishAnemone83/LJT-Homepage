# Basic site settings
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Junteng Liu's academic portfolio"
url: "https://wishanemone83.github.io"
baseurl: "/LJT-Homepage/docs"
repository: "WishAnemone83/LJT-Homepage"
locale: "en-US"
site_theme: "default"

# Build settings
include:
  - _pages

exclude:
  - README.md
  - AGENTS.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - package.json
  - scripts
  - markdown_generator
  - talkmap
  - docs

markdown: kramdown
highlighter: rouge
encoding: "utf-8"
permalink: /:categories/:title/
timezone: "Etc/UTC"
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - if-function
    - color-functions

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Author information
author:
  avatar: ""
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Publication settings
publication_category:
  preprints:
    title: "Preprints"
  conferences:
    title: "Conference Papers"

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

atom_feed:
  hide: true
